services:
  postgres:
    image: postgres:16-alpine
    container_name: anarchi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anarchi_db}
      POSTGRES_USER: ${POSTGRES_USER:-anarchi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anarchi_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anarchi} -d ${POSTGRES_DB:-anarchi_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - anarchi-spine

  anarchi-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchi_blog_engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${APP_PORT:-3081}
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    ports:
      - "127.0.0.1:${APP_PORT:-3081}:${APP_PORT:-3081}"
    volumes:
      - .:/app
      - ./data:/app/data
    working_dir: /app
    command: node server.js
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-3081}/api/status >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 12
    networks:
      - anarchi-spine

  research-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchi_research_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/research_bot.py
    environment:
      BOT_NAME: research-bot
      BOT_MODE: headless
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  outreach-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchi_outreach_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/outreach_bot.py
    environment:
      BOT_NAME: outreach-bot
      BOT_MODE: headless
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  crawler-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchi_crawler_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/crawler_bot.py
    environment:
      BOT_NAME: crawler-bot
      BOT_MODE: headless
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  compiler-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchi_compiler_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/compiler_bot.py
    environment:
      BOT_NAME: compiler-bot
      BOT_MODE: headless
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  ollama:
    image: ollama/ollama:latest
    container_name: anarchi_ollama
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NUM_THREAD: "4"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - anarchi-spine

  wide-search-crawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchi_wide_search_crawler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/wide_search_crawler.py
    environment:
      BOT_NAME: wide-search-crawler
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "1800"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      BING_SEARCH_KEY: ${BING_SEARCH_KEY:-}
    networks:
      - anarchi-spine

  dedup-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchi_dedup_engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/dedup_engine.py
    environment:
      BOT_NAME: dedup-engine
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "600"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  seo-bundle-gen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchi_seo_bundle_gen
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/seo_bundle_generator.py
    environment:
      BOT_NAME: seo-bundle-gen
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "600"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  llm-blogger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anarchi_llm_blogger
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/llm_blogger.py
    environment:
      BOT_NAME: llm-blogger
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "1200"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: mistral
    networks:
      - anarchi-spine

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: anarchi_cloudflared
    restart: unless-stopped
    depends_on:
      anarchi-engine:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --config /etc/cloudflared/config.yml
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - anarchi-spine

volumes:
  postgres_data:
  ollama_data:

networks:
  anarchi-spine:
    driver: bridge
