services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anarchi_db}
      POSTGRES_USER: ${POSTGRES_USER:-anarchi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anarchi_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anarchi} -d ${POSTGRES_DB:-anarchi_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - anarchi-spine

  anarchi-engine:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${APP_PORT:-3081}
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    ports:
      - "127.0.0.1:${APP_PORT:-3081}:${APP_PORT:-3081}"
    volumes:
      - .:/app
      - ./data:/app/data
    working_dir: /app
    command: node server.js
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-3081}/api/status >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 12
    networks:
      - anarchi-spine

  research-bot:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/research_bot.py
    environment:
      BOT_NAME: research-bot
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "21600"
      MAX_NEW_QUERIES_PER_CYCLE: "12"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  outreach-bot:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/outreach_bot.py
    environment:
      BOT_NAME: outreach-bot
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "900"
      MONETIZATION_BATCH_SIZE: "6"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  crawler-bot:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/crawler_bot.py
    environment:
      BOT_NAME: crawler-bot
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "900"
      CRAWL_BATCH_SIZE: "3"
      MAX_RESULTS_PER_SOURCE: "6"
      MAX_PAGE_FETCHES: "10"
      MAX_SOURCE_EXCERPT_CHARS: "12000"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  compiler-bot:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/compiler_bot.py
    environment:
      BOT_NAME: compiler-bot
      BOT_MODE: headless
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  ollama:
    profiles: ["workers"]
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NUM_THREAD: "6"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - anarchi-spine

  model-loader:
    profiles: ["workers"]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-granite4:tiny-h}"]
    networks:
      - anarchi-spine

  wide-search-crawler:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/wide_search_crawler.py
    environment:
      BOT_NAME: wide-search-crawler
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "1800"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      BING_SEARCH_KEY: ${BING_SEARCH_KEY:-}
    networks:
      - anarchi-spine

  dedup-engine:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/dedup_engine.py
    environment:
      BOT_NAME: dedup-engine
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "600"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  seo-bundle-gen:
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/seo_bundle_generator.py
    environment:
      BOT_NAME: seo-bundle-gen
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "600"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  llm-blogger:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-loader:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/llm_blogger.py
    environment:
      BOT_NAME: llm-blogger
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "300"
      SERIALIZE_BATCH_SIZE: "50"
      GENERATION_BATCH_SIZE: "1"
      MIN_POST_WORDS: "1400"
      MAX_POST_WORDS: "2800"
      OLLAMA_CONTEXT_TOKENS: "8192"
      OLLAMA_REQUEST_TIMEOUT_SECONDS: "900"
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-granite4:tiny-h}
    networks:
      - anarchi-spine

  publisher-bot:
    profiles: ["publisher"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
    command: python3 -u /app/workers/publisher_bot.py
    environment:
      BOT_NAME: publisher-bot
      BOT_MODE: headless
      BOT_INTERVAL_SECONDS: "300"
      DAILY_PUBLISH_LIMIT: ${DAILY_PUBLISH_LIMIT:-3}
      PUBLISH_TIMEZONE: ${PUBLISH_TIMEZONE:-America/Chicago}
      PUBLISH_SLOTS: ${PUBLISH_SLOTS:-08:15,13:15,18:15}
      DATABASE_URL: postgres://${POSTGRES_USER:-anarchi}:${POSTGRES_PASSWORD:-anarchi_password}@postgres:5432/${POSTGRES_DB:-anarchi_db}
    networks:
      - anarchi-spine

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      anarchi-engine:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --config /etc/cloudflared/config.yml
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      - anarchi-spine

volumes:
  postgres_data:
  ollama_data:

networks:
  anarchi-spine:
    driver: bridge
